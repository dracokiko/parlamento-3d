name: EUR-Lex Directives Sync

on:
  schedule:
    - cron: "0 4 * * 0"   # todos os domingos às 04:00 UTC (05:00 Lisboa)
  workflow_dispatch:       # permite correr manualmente quando necessário

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ar-data-sync/package.json

      - name: Instalar dependências
        working-directory: ar-data-sync
        run: npm install

      - name: Sincronizar diretivas UE (EUR-Lex)
        working-directory: ar-data-sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/eurlexSync.js

      - name: Email — sucesso
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ EUR-Lex Sync concluído — ${{ github.run_number }}"
          to: ${{ secrets.GMAIL_USER }}
          from: Parlamento 3D <${{ secrets.GMAIL_USER }}>
          body: |
            O pipeline de diretivas UE do Parlamento 3D correu com sucesso.

            Data: ${{ github.run_started_at }}
            Ver detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email — falha
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ EUR-Lex Sync falhou — ${{ github.run_number }}"
          to: ${{ secrets.GMAIL_USER }}
          from: Parlamento 3D <${{ secrets.GMAIL_USER }}>
          body: |
            O pipeline de diretivas UE do Parlamento 3D falhou.

            Data: ${{ github.run_started_at }}
            Ver detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
