name: EUR-Lex Directives Sync

on:
  schedule:
    - cron: "0 4 * * 0"   # todos os domingos às 04:00 UTC (05:00 Lisboa)
  workflow_dispatch:       # permite correr manualmente quando necessário

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ar-data-sync/package.json

      - name: Instalar dependências
        working-directory: ar-data-sync
        run: npm install

      - name: Sincronizar diretivas UE (EUR-Lex)
        working-directory: ar-data-sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node src/eurlexSync.js
