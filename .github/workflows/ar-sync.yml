name: AR Data Sync

on:
  schedule:
    - cron: "0 3 * * *"   # todos os dias às 03:00 UTC (04:00 Lisboa)
  workflow_dispatch:
    inputs:
      recurso:
        description: "iniciativas | intervencoes | votacoes (vazio = todos)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ar-data-sync/package.json

      - name: Instalar dependências
        working-directory: ar-data-sync
        run: npm install

      - name: Correr sincronização
        working-directory: ar-data-sync
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.recurso }}" ]; then
            node src/sync.js ${{ github.event.inputs.recurso }}
          else
            node src/sync.js
          fi

      - name: Email — sucesso
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "✅ AR Sync concluído — ${{ github.run_number }}"
          to: ${{ secrets.GMAIL_USER }}
          from: Parlamento 3D <${{ secrets.GMAIL_USER }}>
          body: |
            O pipeline de dados do Parlamento 3D correu com sucesso.

            Data: ${{ github.run_started_at }}
            Ver detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email — falha
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "❌ AR Sync falhou — ${{ github.run_number }}"
          to: ${{ secrets.GMAIL_USER }}
          from: Parlamento 3D <${{ secrets.GMAIL_USER }}>
          body: |
            O pipeline de dados do Parlamento 3D falhou.

            Data: ${{ github.run_started_at }}
            Ver detalhes: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
